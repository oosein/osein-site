<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>oSein - Discord Moderator</title>
    <style>
        :root {
            /* Dark theme */
            --bg-primary: #0f0f0f;
            --bg-secondary: #1a1a1a;
            --bg-card: #1f1f1f;
            --text-primary: #e5e5e5;
            --text-secondary: #b0b0b0;
            --accent: #aaaaaa;
            --glow: rgba(170, 170, 170, 0.3);
            --border: #2a2a2a;
        }

        [data-theme="light"] {
            --bg-primary: #f8f8f8;
            --bg-secondary: #e5e5e5;
            --bg-card: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --accent: #666666;
            --glow: rgba(170, 170, 170, 0.4);
            --border: #d0d0d0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Cursor Custom */
        body.custom-cursor {
            cursor: none;
        }

        .cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            background: var(--accent);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            mix-blend-mode: difference;
            transition: transform 0.12s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 20px var(--glow);
            will-change: transform;
        }

        .cursor.hover {
            transform: scale(1.5);
            box-shadow: 0 0 30px var(--glow);
        }

        /* Background */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 80%, rgba(170,170,170,0.08) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(170,170,170,0.08) 0%, transparent 50%),
                        radial-gradient(circle at 40% 40%, rgba(170,170,170,0.04) 0%, transparent 50%);
            z-index: -1;
            animation: float 25s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            33% { transform: translateY(-15px) rotate(120deg); }
            66% { transform: translateY(8px) rotate(240deg); }
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header */
        header {
            padding: 2rem 0 4rem;
            text-align: center;
            position: relative;
        }

        .avatar-container {
            position: relative;
            display: inline-block;
            margin-bottom: 1.5rem;
        }

        .avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4), 0 0 30px var(--glow);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .avatar:hover {
            transform: scale(1.05);
            box-shadow: 0 35px 70px rgba(0,0,0,0.5), 0 0 40px var(--glow);
        }

        .avatar-orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 180px;
            height: 180px;
            border: 1px solid var(--accent);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.25;
            animation: rotate 15s linear infinite;
        }

        .avatar-particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0.5;
            animation: orbit 5s linear infinite;
            box-shadow: 0 0 12px var(--glow);
        }

        @keyframes rotate {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        @keyframes orbit {
            0% { transform: translateX(-50%) translateY(0) rotate(0deg); }
            50% { transform: translateX(-50%) translateY(-65px) rotate(180deg); }
            100% { transform: translateX(-50%) translateY(0) rotate(360deg); }
        }

        h1 {
            font-size: clamp(2.2rem, 5vw, 3.8rem);
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--text-primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.25rem;
            margin-bottom: 3rem;
        }

        /* Theme & Language Toggle */
        .toggles {
            display: flex;
            gap: 1.2rem;
            justify-content: center;
            margin-bottom: 4rem;
            flex-wrap: wrap;
        }

        .toggle-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.8rem 1.8rem;
            border-radius: 50px;
            cursor: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 6px 25px rgba(0,0,0,0.15);
        }

        .toggle-btn:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 12px 40px var(--glow);
            border-color: var(--accent);
        }

        /* Sections */
        section {
            padding: 5rem 0;
            opacity: 0;
            transform: translateY(40px);
            transition: all 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        section.animate {
            opacity: 1;
            transform: translateY(0);
        }

        section h2 {
            text-align: center;
            font-size: 2.8rem;
            margin-bottom: 4rem;
            font-weight: 600;
        }

        /* About */
        .about-container {
            max-width: 720px;
            margin: 0 auto;
            background: var(--bg-card);
            padding: 3.5rem;
            border-radius: 28px;
            box-shadow: 0 25px 70px rgba(0,0,0,0.25);
            border: 1px solid var(--border);
            text-align: center;
        }

        .about-container p {
            font-size: 1.15rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
            line-height: 1.85;
        }

        /* Skills */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 2.5rem;
            margin-top: 3rem;
        }

        .skill-item {
            background: var(--bg-card);
            padding: 2.5rem 2rem;
            border-radius: 24px;
            border: 1px solid var(--border);
            text-align: center;
            cursor: none;
            transition: all 0.45s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 12px 45px rgba(0,0,0,0.15);
        }

        .skill-item:hover {
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 25px 70px var(--glow);
            border-color: var(--accent);
        }

        .skill-item h3 {
            font-size: 1.3rem;
            margin-bottom: 1.2rem;
            font-weight: 600;
        }

        .skill-bar {
            width: 100%;
            height: 10px;
            background: var(--border);
            border-radius: 12px;
            overflow: hidden;
            margin-top: 1.2rem;
        }

        .skill-progress {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--text-primary));
            border-radius: 12px;
            width: 0%;
            transition: width 2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 25px var(--glow);
        }

        .skill-item:hover .skill-progress {
            width: var(--progress);
        }

        /* Servers */
        .servers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2.5rem;
            margin-top: 4rem;
        }

        .server-card {
            background: var(--bg-card);
            border-radius: 28px;
            overflow: hidden;
            border: 1px solid var(--border);
            cursor: none;
            transition: all 0.45s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }

        .server-card:hover {
            transform: translateY(-12px) scale(1.03);
            box-shadow: 0 35px 90px var(--glow);
            border-color: var(--accent);
        }

        .server-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .server-content {
            padding: 2.2rem;
        }

        .server-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.6rem;
            color: var(--text-primary);
        }

        .server-role {
            color: var(--accent);
            font-size: 1rem;
            font-weight: 500;
            margin-bottom: 1.2rem;
        }

        .server-desc {
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 1.7;
            margin-bottom: 1.8rem;
        }

        /* Connect */
        .connect-container {
            max-width: 550px;
            margin: 4rem auto 0;
            background: var(--bg-card);
            padding: 3.5rem;
            border-radius: 28px;
            border: 1px solid var(--border);
            text-align: center;
            box-shadow: 0 25px 70px rgba(0,0,0,0.25);
        }

        .connect-container h3 {
            font-size: 1.8rem;
            margin-bottom: 1.2rem;
        }

        .connect-container p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: 2.5rem;
            line-height: 1.7;
        }

        .discord-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 2rem;
            filter: brightness(1.1) contrast(1.1);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .connect-container:hover .discord-icon {
            filter: brightness(1.4) drop-shadow(0 0 20px var(--glow));
            transform: scale(1.1);
        }

        /* Buttons */
        .btn {
            background: linear-gradient(135deg, var(--bg-secondary), var(--bg-card));
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 1.1rem 2.4rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            display: inline-block;
            cursor: none;
            transition: all 0.45s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 35px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
            font-size: 1rem;
        }

        .btn:hover {
            transform: translateY(-5px) scale(1.03);
            box-shadow: 0 20px 60px var(--glow);
            border-color: var(--accent);
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transition: left 0.6s;
        }

        .btn:hover::before {
            left: 100%;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 4rem 0 2rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--border);
            margin-top: 6rem;
            font-size: 0.95rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container { padding: 0 18px; }
            .toggles { flex-direction: column; align-items: center; gap: 1rem; }
            .about-container, .connect-container { padding: 2.5rem 2rem; margin: 0 1rem; }
            section { padding: 3rem 0; }
            section h2 { font-size: 2.2rem; }
            .servers-grid { grid-template-columns: 1fr; }
        }

        /* Scroll animations */
        .fade-in {
            opacity: 0;
            transform: translateY(50px);
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
