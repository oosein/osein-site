<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>oSein — Discord Staff</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #0a0a0a;
        --panel: #111111;
        --line: #1a1a1a;
        --line2: #2d2d2d;
        --line3: #444444;
        --text: #f0f0f0;
        --muted: #888888;
        --muted2: #666666;
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, sans-serif;
        overflow-x: hidden;
      }
      a { color: inherit; text-decoration: none; }
      button, a { font: inherit; }

      .page {
        min-height: 100vh;
        position: relative;
        overflow: hidden;
        background: var(--bg);
      }

      .bg {
        pointer-events: none;
        position: absolute;
        inset: 0;
        opacity: .1;
        background:
          radial-gradient(circle at 20% 10%, rgba(255,255,255,.015), transparent 20%),
          radial-gradient(circle at 80% 30%, rgba(255,255,255,.012), transparent 18%),
          radial-gradient(circle at 50% 90%, rgba(255,255,255,.01), transparent 22%);
      }

      .nav {
        position: fixed;
        top: 0; left: 0; right: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 24px;
        background: var(--bg);
        border-bottom: 1px solid var(--line);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }

      .dot {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: var(--text);
      }

      .brand span {
        font-family: "Space Grotesk", sans-serif;
        font-size: 13px;
        font-weight: 600;
      }

      .navlinks {
        display: none;
        align-items: center;
        gap: 20px;
      }

      .navlinks button {
        background: transparent;
        border: 0;
        color: var(--muted);
        padding: 0;
        font-size: 12px;
        cursor: pointer;
        transition: .2s;
      }

      .navlinks button:hover,
      .navlinks button.active {
        color: var(--text);
        transform: translateY(-1px);
      }

      .lang {
        display: flex;
        align-items: center;
        padding: 3px;
        border-radius: 999px;
        background: var(--panel);
        border: 1px solid var(--line);
      }

      .lang button {
        border: 0;
        background: transparent;
        color: var(--muted);
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 11px;
        cursor: pointer;
        transition: .2s;
      }

      .lang button.active {
        background: #1a1a1a;
        color: var(--text);
      }

      .lang button:hover { color: var(--text); }

      .section {
        padding: 0 24px;
        position: relative;
      }

      #hero {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      .hero-bg {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(circle at top, rgba(255,255,255,.01), transparent 40%),
          radial-gradient(circle at bottom, rgba(255,255,255,.008), transparent 34%);
      }

      .hero-inner {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .avatar-wrap {
        position: relative;
        margin-bottom: 12px;
      }

      .avatar-wrap .ring1,
      .avatar-wrap .ring2,
      .avatar-wrap .ring3 {
        position: absolute;
        border-radius: 999px;
      }

      .avatar-wrap .ring1 {
        inset: -6px;
        border: 1px solid rgba(255,255,255,.08);
      }

      .avatar-wrap .ring2 {
        inset: -3px;
        background: linear-gradient(135deg, rgba(255,255,255,.12), rgba(255,255,255,.03), rgba(255,255,255,.08));
      }

      .avatar-wrap .ring3 {
        inset: -11px;
        border: 1px solid rgba(255,255,255,.025);
      }

      .avatar {
        position: relative;
        z-index: 1;
        width: 100px;
        height: 100px;
        border-radius: 999px;
        object-fit: cover;
        display: block;
      }

      .badge {
        margin-bottom: 8px;
        padding: 3px 12px;
        border: 1px solid var(--line);
        background: #111;
        border-radius: 999px;
        font-size: 9px;
        text-transform: uppercase;
        color: var(--muted);
        transition: .2s;
      }

      .badge:hover { border-color: #2a2a2a; }

      h1 {
        margin: 0;
        font-size: 52px;
        line-height: 1;
        font-weight: 600;
        letter-spacing: -.04em;
      }

      .subtitle {
        margin: 10px 0 8px;
        font-size: 15px;
        color: var(--muted);
      }

      .desc {
        margin: 0 0 28px;
        max-width: 260px;
        font-size: 13px;
        color: var(--muted2);
        line-height: 1.55;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px 20px;
        border-radius: 999px;
        border: 1px solid var(--line2);
        color: var(--text);
        background-color: #111111;
        box-shadow: inset 0 1px 0 rgba(255,255,255,.03);
        font-size: 13px;
        font-weight: 500;
        transition: .2s;
        cursor: pointer;
      }

      .btn:hover {
        transform: scale(1.02);
        background-color: #161616;
        border-color: var(--line3);
      }

      .stats-top {
        padding: 56px 24px 56px;
        position: relative;
        overflow: hidden;
      }

      .stats-top::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, rgba(255,255,255,.008), transparent 60%);
        pointer-events: none;
      }

      .stat-main {
        position: relative;
        z-index: 1;
        max-width: 420px;
        margin: 0 auto;
        text-align: center;
      }

      .stat-main .num {
        font-size: 56px;
        line-height: 1;
        font-weight: 600;
        letter-spacing: -.04em;
        margin: 0;
        font-family: Inter, sans-serif;
      }

      .stat-main .label {
        margin: 8px 0 0;
        font-size: 13px;
        color: var(--muted);
        letter-spacing: .04em;
        font-family: "Space Grotesk", sans-serif;
      }

      .experience,
      .how,
      .contact {
        padding-top: 64px;
        padding-bottom: 64px;
      }

      .title-row {
        display: flex;
        align-items: center;
        gap: 16px;
        max-width: 900px;
        margin: 0 auto 32px;
      }

      .title-row h2 {
        margin: 0;
        font-size: 26px;
        font-weight: 600;
        font-family: "Space Grotesk", sans-serif;
      }

      .line {
        height: 1px;
        background: var(--line);
        flex: 1;
      }

      .grid1 {
        max-width: 580px;
        margin: 0 auto 12px;
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .grid2 {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .card {
        display: flex;
        flex-direction: column;
        padding: 16px;
        border-radius: 16px;
        background: var(--panel);
        border: 1px solid var(--line);
        transition: .2s;
      }

      .card:hover {
        transform: translateY(-3px) scale(1.02);
        border-color: #2a2a2a;
      }

      .card-top {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 8px;
      }

      .card-top img {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        object-fit: cover;
        transition: .2s;
      }

      .card:hover .card-top img { transform: scale(1.03); }

      .card h3 {
        margin: 0;
        font-size: 13px;
        font-weight: 500;
        font-family: "Space Grotesk", sans-serif;
      }

      .card p {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
        flex: 1;
      }

      .chip {
        align-self: flex-start;
        font-size: 11px;
        color: var(--muted);
        padding: 4px 12px;
        border: 1px solid var(--line);
        border-radius: 999px;
        transition: .2s;
      }

      .chip:hover {
        border-color: #333;
        color: var(--text);
        transform: scale(1.02);
      }

      .stats-bottom {
        padding: 10px 24px 40px;
      }

      .stats-bottom p {
        max-width: 340px;
        margin: 0 auto;
        text-align: center;
        color: #555;
        font-size: 12px;
        line-height: 1.6;
      }

      .how-list {
        max-width: 560px;
        margin: 0 auto;
      }

      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--panel);
        transition: .2s;
        margin-bottom: 8px;
      }

      .row:hover {
        transform: translateY(-2px) scale(1.02);
        border-color: #2a2a2a;
      }

      .row .n {
        font-size: 10px;
        color: #333;
        font-family: "Space Grotesk", sans-serif;
        flex: 0 0 auto;
      }

      .row .txt {
        color: #b0b0b0;
        font-size: 13px
